plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.gradleup.shadow' version '8.3.9' apply false
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven {
        name = 'Essential'
        url = 'https://repo.essential.gg/public'
    }
    mavenCentral()
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                    file('src/generated/resources/').absolutePath, '--existing',
                    file('src/main/resources/').absolutePath
        }

        configureEach {
            gameDirectory = file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly 'org.jetbrains:annotations:24.1.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '500000']
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

def essentialPartnerModPackage = 'com.solegendary.reignofnether.essentialpartnermod'
def essentialPartnerModDep = 'gg.essential:partner-mod-integration-1.21.1-neoforge:1.0.7'

tasks.register('relocatedEssentialPartnerModJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    destinationDirectory = layout.buildDirectory.dir('devlibs')
    archiveFileName = 'essentialpartner.jar'
    inputs.property('essentialPartnerModPackage', essentialPartnerModPackage)

    def partnerConfiguration = project.configurations.detachedConfiguration(
            project.dependencies.create(essentialPartnerModDep)
    )
    dependsOn partnerConfiguration
    from({ partnerConfiguration.collect { zipTree(it) } })
    exclude 'mcmod.info', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'pack.mcmeta',
            'gg/essential/partnermod/EssentialPartnerMod.class'
    relocate 'gg.essential.partnermod', essentialPartnerModPackage
    filesMatching('gg/essential/partnermod/mixins.json') {
        filter { it.replace('gg.essential.partnermod', essentialPartnerModPackage) }
    }
}

jar {
    manifest.attributes([
            'Specification-Title'      : mod_id,
            'Specification-Vendor'     : 'SoLegendary',
            'Specification-Version'    : '1',
            'Implementation-Title'     : project.name,
            'Implementation-Version'   : project.version,
            'Implementation-Vendor'    : 'SoLegendary',
            'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'             : "${essentialPartnerModPackage.replace('.', '/')}/mixins.json,reignofnether.mixins.json"
    ])
    from(tasks.named('relocatedEssentialPartnerModJar').flatMap { it.archiveFile }.map { zipTree(it) })
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
